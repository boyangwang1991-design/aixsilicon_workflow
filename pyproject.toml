[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aixworkflow"
version = "0.1.0"
description = "AIXSILICON multi-repo workspace control plane: manifest, lockfile, fusesoc aggregation, flows, evidence"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AIXSILICON Platform Team" }]
keywords = ["hdl", "fusesoc", "workspace", "multi-repo", "uvm", "soc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]

dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.18",
    "rich>=13.0",
]

[project.optional-dependencies]
wenwang-model = [
    "torch==2.8.0+cpu; sys_platform == 'linux' or sys_platform == 'win32'",
    "numpy==2.4.6",
    "Pillow==12.3.0",
    "transformers==5.16.1",
    "safetensors>=0.4",
    "requests>=2.32",
    "cmake==3.28.4",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "pre-commit>=3.7",
]

# 文档解析按需安装，仓库管理不下载 PyTorch/CUDA。
docs = [
    "docling>=2.0",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "pypdf>=4.0",
]
# 文档增强包含基础解析器，保留原有 --extra doc-enhance 用法。
doc-enhance = [
    "aixworkflow[docs]",
    "python-docx>=1.1",   # Word 深层结构：修订/批注/题注补充路径
    "python-pptx>=1.0",   # PowerPoint 空间语义与备注补充路径
    "pandas>=2.0",        # Excel 规则数据区识别
    "markitdown",         # 快速路径与基准对照
]
ip-dev = [
    "dilithium-py==1.4.0",
    "fusesoc>=2.4.7",
    "kyber-py==1.2.0",
    "matplotlib>=3.11.1",
    "peakrdl>=1.5.0",
    "peakrdl-cheader>=1.1.0",
    "peakrdl-html>=2.12.2",
    "peakrdl-ipxact>=3.5.0",
    "peakrdl-regblock>=1.3.1",
    "peakrdl-uvm>=2.4.0",
    "pytest>=9.1.1",
]

# PyPI 镜像源统一托管在项目级 `uv.toml`（index-url = 清华源），
# 默认镜像由 uv.toml 决定；PyTorch显式源的元数据声明与uv.toml保持一致。

[project.scripts]
# `aix` 通过引导器委托：物化 canonical runtime（私有 skill repo）后运行。
aix = "aix_launcher:main"

[tool.uv.sources]
torch = { index = "pytorch-cpu", extra = "wenwang-model" }

# uv requires source index declarations here; uv.toml carries the matching
# runtime index configuration alongside the workspace's default mirror.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools]
# 本仓是 manifest 驱动的多仓工作区控制面，根目录只分发两个引导模块；
# 私有运行时（aixworkflow src）由 bootstrap.py 物化，不参与打包。
py-modules = ["aix_launcher", "bootstrap"]

# 显式声明为空包集合：禁止 setuptools 在仓库根递归发现包。
# 若使用 packages.find(where = ["."])，构建会把 repos/（14G，含 492 个
# __init__.py）、cache/、build/、.roo/ 等运行期目录当作候选包做全树扫描
# 与 sdist 清单推演，单线程纯 CPU 长跑使 `uv sync` 长时间无输出，表现为“卡死”。
# 详见 .roo/skills/aixsilicon-workspace-management/references/uv-environment.md。
[tool.setuptools.packages.find]
where = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
cache_dir = "cache/pytest"
markers = [
    "unit: fast, dependency-free unit tests",
    "integration: tests using temporary git fixtures",
    "e2e: end-to-end scenarios",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = [".roo/skills/aixsilicon-workspace-management/src"]
# 缓存统一归置到根 cache/（避免 .ruff_cache 污染根目录；cache/ 已在 .gitignore 忽略）
cache-dir = "cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = [".roo/skills/aixsilicon-workspace-management/src/aixworkflow"]
strict = true
