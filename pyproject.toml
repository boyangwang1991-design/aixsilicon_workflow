[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aixworkflow"
version = "0.1.0"
description = "AIXSILICON multi-repo workspace control plane: manifest, lockfile, fusesoc aggregation, flows, evidence"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AIXSILICON Platform Team" }]
keywords = ["hdl", "fusesoc", "workspace", "multi-repo", "uvm", "soc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]

dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.18",
    "rich>=13.0",
    # doc-to-markdown 统一基础解析引擎（DOCX/PPTX/XLSX/PDF → DoclingDocument → IR）
    "docling>=2.0",
    # Excel 主解析器（区域/公式/合并；docling 之外的结构补充）
    "openpyxl>=3.1",
    # PDF 文本后备（docling 未覆盖时 pdfplumber → pypdf）
    "pdfplumber>=0.11",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "pre-commit>=3.7",
]
# 文档转换格式增强解析器（P2/P3 按需启用）
doc-enhance = [
    "python-docx>=1.1",   # Word 深层结构：修订/批注/题注补充路径
    "python-pptx>=1.0",   # PowerPoint 空间语义与备注补充路径
    "pandas>=2.0",        # Excel 规则数据区识别
    "markitdown",         # 快速路径与基准对照
]

[project.scripts]
aix = "aixworkflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aixworkflow = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "unit: fast, dependency-free unit tests",
    "integration: tests using temporary git fixtures",
    "e2e: end-to-end scenarios",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/aixworkflow"]
strict = true
