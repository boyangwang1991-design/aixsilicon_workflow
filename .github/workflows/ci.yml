# Parent repo CI: unit + integration tests, lint, pre-commit guards,
# and the repo-hygiene guard (no sub-repo source / nested .git / EDA artifacts).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install with dev deps
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests scripts
      - name: Unit + integration tests
        run: pytest -q
      - name: Guard: no runtime paths in tree
        run: python scripts/hooks/guard_runtime_paths.py
      - name: Guard: unified aixsilicon VLNV namespace
        run: python scripts/hooks/check_vlnv_namespace.py
      - name: Guard: no sub-repo source / nested .git committed
        run: |
          set -e
          # fail if the parent index contains a nested .git or repos/ path
          if git ls-files | grep -qE '(^|/)\.git($|/)|^repos/|^build/|^cache/|^\.aix/'; then
            echo "Forbidden committed paths detected"; exit 1
          fi
          echo "repo hygiene guard passed"
