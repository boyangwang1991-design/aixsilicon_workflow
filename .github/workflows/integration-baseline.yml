# Integration CI: multi-repo checkout, compatibility, representative regression.
name: Integration Baseline

on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [minimal, ip-dev, cbb-dev, dv-dev, soc-integration, release]
        default: ip-dev
  schedule:
    - cron: '17 2 * * *'   # nightly drift detection (no auto-baseline changes)

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CLI
        run: pip install -e ".[dev]"
      - name: Init + sync (baseline lock)
        run: |
          aix wf init --profile "${{ inputs.profile || 'ip-dev' }}"
          aix wf sync --lock locks/baseline.lock.yaml
      - name: Doctor
        run: aix wf doctor
      - name: Generate FuseSoC config
        run: aix wf fusesoc --generate
      - name: Compatibility / representative regression (placeholder)
        run: |
          echo "Run hwif-compat, representative IP/VIP regression here."
