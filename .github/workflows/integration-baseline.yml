# Integration CI: multi-repo checkout, compatibility, representative regression.
name: Integration Baseline

on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [minimal, ip-dev, cbb-dev, soc-integration, all]
        default: ip-dev
  # nightly drift detection disabled (2026-08): local-first workflow; restore
  # the schedule trigger below to re-enable (no auto-baseline changes).
  # schedule:
  #   - cron: '17 2 * * *'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CLI + FuseSoC
        run: |
          pip install -e ".[dev]"
          pip install "fusesoc==2.4.*"
      - name: Init + sync
        run: |
          aix wf init --profile "${{ inputs.profile || 'ip-dev' }}"
          aix wf sync
      - name: Doctor
        run: aix wf doctor
      - name: Generate FuseSoC config
        run: aix wf fusesoc --generate
      - name: Discover all cores across roots (parse + VLNV index)
        run: |
          set -euo pipefail
          fusesoc --cores-root repos core list > /dev/null
          echo "cores discovered under repos/"
