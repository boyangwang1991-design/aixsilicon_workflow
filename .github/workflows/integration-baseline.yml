# Integration CI: multi-repo checkout, compatibility, representative regression.
name: Integration Baseline

on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [minimal, ip-dev, cbb-dev, dv-dev, soc-integration, release]
        default: ip-dev
  schedule:
    - cron: '17 2 * * *'   # nightly drift detection (no auto-baseline changes)

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CLI + FuseSoC
        run: |
          pip install -e ".[dev]"
          pip install "fusesoc==2.4.*"
      - name: Init + sync (baseline lock)
        run: |
          aix wf init --profile "${{ inputs.profile || 'ip-dev' }}"
          aix wf sync --lock locks/baseline.lock.yaml
      - name: Doctor
        run: aix wf doctor
      - name: Generate FuseSoC config
        run: aix wf fusesoc --generate
      - name: Discover all cores across roots (parse + VLNV index)
        run: |
          set -euo pipefail
          fusesoc --cores-root repos core list > /dev/null
          echo "cores discovered under repos/"
      - name: Report drift vs baseline lock
        run: |
          set +e
          aix wf diff --against locks/baseline.lock.yaml
          echo "NOTE: drift is reported, never auto-changed (plan.md §19.3)"
