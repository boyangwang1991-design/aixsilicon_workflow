# Change Bundle integration: validate bundle, checkout PR heads, joint checks.
# All events carry correlation_id + depth; no recursive event loops (github.py).
name: Change Bundle

on:
  workflow_dispatch:
    inputs:
      bundle:
        type: string
        required: true
        description: 'bundle id under changesets/'
      correlation_id:
        type: string
        required: false
      depth:
        type: number
        default: 0

permissions:
  contents: read
  pull-requests: read

jobs:
  bundle-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CLI
        run: pip install -e ".[dev]"
      - name: Guard event depth (correlation/depth, no recursion)
        run: |
          python - "${{ inputs.depth }}" <<'PY'
          import sys
          from aixworkflow.github import DispatchEvent, guard_event_loop
          guard_event_loop(DispatchEvent(
              correlation_id="${{ inputs.correlation_id || 'ci' }}",
              source_repo="aixsilicon_workflow",
              source_sha="ci", depth=int(sys.argv[1])))
          print("event depth ok")
          PY
      - name: Validate bundle + merge order
        run: |
          aix bundle validate "${{ inputs.bundle }}"
      - name: Checkout each PR head into the workspace
        run: |
          set -euo pipefail
          python - "${{ inputs.bundle }}" <<'PY'
          import sys
          from pathlib import Path
          from aixworkflow.bundle import load_bundle
          from aixworkflow.yamlutil import write_yaml
          name = sys.argv[1]
          path = Path('changesets') / (name if name.endswith('.yaml') else f'{name}.yaml')
          bundle = load_bundle(path)
          override = {
              'schema_version': 'aix.workspace-override/v1',
              'repositories': {
                  r.id: {'revision': {'branch': r.branch}}
                  for r in bundle.repositories
              },
          }
          Path('.aix').mkdir(exist_ok=True)
          write_yaml(Path('.aix') / 'bundle-override.yaml', override)
          print(f"bundle {bundle.id}: {len(bundle.repositories)} repo(s), order {bundle.validation.get('profile', 'minimal')}")
          PY
      - name: Joint workspace checks
        run: |
          aix wf doctor || true
          echo "Joint required targets execute here once EDA/tool providers are installed."
