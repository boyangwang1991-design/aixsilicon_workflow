# Reusable: unit simulation for asset repos.
name: Reusable Unit Sim

on:
  workflow_call:
    inputs:
      repo_type:
        type: string
        required: true
      target:
        type: string
        default: unit_sim
      tool:
        type: string
        default: verilator
    secrets:
      inherit:

jobs:
  unit-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FuseSoC
        run: pip install "fusesoc==2.4.*"
      - name: Run unit sim
        run: |
          echo "tool=${{ inputs.tool }} target=${{ inputs.target }} repo_type=${{ inputs.repo_type }}"
          # FuseSoC run entry for the asset repo target:
          fusesoc run --target "${{ inputs.target }}" --tool "${{ inputs.tool }}" "${{ inputs.target }}"
