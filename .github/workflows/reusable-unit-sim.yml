# Reusable: unit simulation for asset repos.
# Public workflows must pin a Release Tag or Commit SHA, never long-lived `main`.
name: Reusable Unit Sim

on:
  workflow_call:
    inputs:
      repo_type:
        type: string
        required: true
      vlnv:
        type: string
        required: true
        description: 'core to run (e.g. aix:vip:apb:1.0.0)'
      target:
        type: string
        default: unit_sim
      tool:
        type: string
        default: verilator
      fusesoc_version:
        type: string
        default: '2.4.*'
    secrets:
      inherit:

jobs:
  unit-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FuseSoC
        run: pip install "fusesoc==${{ inputs.fusesoc_version }}"
      - name: Run unit sim
        run: fusesoc run --target "${{ inputs.target }}" --tool "${{ inputs.tool }}" "${{ inputs.vlnv }}"
