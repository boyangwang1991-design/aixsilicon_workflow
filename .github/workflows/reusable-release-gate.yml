# Reusable: release readiness gate (G7 checks).
# Requires a protected environment with human approval.
name: Reusable Release Gate

on:
  workflow_call:
    inputs:
      asset:
        type: string
        required: true
      version:
        type: string
        required: true
      lock_path:
        type: string
        required: true
    secrets:
      inherit:

jobs:
  release-gate:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - name: Assert clean and locked
        run: |
          # Must be clean; must use fixed lock; no local override.
          test -z "$(git status --porcelain)" || { echo "dirty workspace"; exit 1; }
          test -f "${{ inputs.lock_path }}" || { echo "missing lock"; exit 1; }
      - name: Verify release material
        run: |
          echo "asset=${{ inputs.asset }} version=${{ inputs.version }}"
          echo "Release material checks (CHANGELOG/SBOM/RTM) run here."
