# HWIF 变更子流程
# 本 flow 只引用 `aixworkflow.runner.default_registry()` 已注册的 action：
#   - hwif.contract-validate / hwif.generate / hwif.impact / hwif.core / hwif.package
#     （委托 hwif-development-suite 唯一入口 hwif_tool.py，P1–P4 收敛后的事实源）
#   - hwif.compatibility-check（兼容判定）
#   - fusesoc.target / evidence.index / release.package
# tool.* / catalog.* / impact.* 为 F-004 有意保留的 action inventory gap，不在 flow 中使用。
schema_version: aix.flow/v1
name: hwif-change
description: 接口契约变更 → Schema/语义检查 → 多视图生成 → SemVer 判定 → 下游影响验证
inputs:
  - contract_path
  - change_type

preconditions:
  clean_workspace: true
  lock_required: true

stages:
  - id: schema
    uses: hwif.contract-validate
    with:
      contract: <contract_path>

  - id: semantics
    needs: [schema]
    uses: hwif.contract-validate
    with:
      contract: <contract_path>

  - id: regenerate
    needs: [semantics]
    uses: hwif.generate
    write_scope:
      - {repo: hwif, paths: [generated, rtl]}

  - id: semver-impact
    needs: [regenerate]
    uses: hwif.impact
    with:
      family: <family>

  - id: vip-build-test
    needs: [semver-impact]
    uses: fusesoc.target
    with:
      target: vip-compile

  - id: cbb-ip-test
    needs: [vip-build-test]
    uses: fusesoc.target
    with:
      target: affected-compile

  - id: soc-impact
    needs: [cbb-ip-test]
    uses: hwif.impact
    with:
      family: <family>

  - id: compat-matrix
    needs: [soc-impact]
    uses: hwif.compatibility-check
    with:
      producer: <contract_path>
      consumer: <consumer_contract_path>

  - id: evidence
    needs: [schema, semantics, regenerate, semver-impact, vip-build-test, cbb-ip-test, soc-impact]
    uses: evidence.index

gates:
  - G0
  - G1
  - G2
  - G3
  - G4
  - G5
  - G6
