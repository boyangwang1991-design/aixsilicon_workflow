# 证据策略
schema_version: aix.policy/v1
name: evidence-policy
version: 0.1.0

evidence_levels:
  - id: E0
    name: 本地开发
    purpose: 快速调试
    retention: local-short-term
  - id: E1
    name: PR 验证
    purpose: Code Review
    retention: ci-artifact-periodic
  - id: E2
    name: Qualification
    purpose: 资产合格
    retention: tied-to-candidate-version-no-silent-overwrite
  - id: E3
    name: Release/Signoff
    purpose: 正式交付
    retention: full-archive

rules:
  - id: evid-run-manifest
    description: Run Manifest 必须记录 Run ID、correlation ID、Lock、SHA、输入、Stage 摘要、Gate 结论、Artifact Hash
    enforcement: hard

  - id: evid-record-actual-sha
    description: Evidence 与 Run Manifest 必须记录实际 SHA，不能只记录分支名
    enforcement: hard

  - id: evid-structured-gates
    description: Gate 结果必须结构化，不能只依赖日志关键词
    enforcement: hard

  - id: evid-seed-traceable
    description: Hash、工具版本和随机种子必须可追溯
    enforcement: hard

  - id: evid-no-credentials
    description: Lockfile、日志或报告中不保存凭据
    enforcement: hard

  - id: evid-redact-logs
    description: 日志自动脱敏
    enforcement: hard

  - id: evid-failure-signature
    description: 失败 Run 可定位到仓库、SHA、Stage、工具和 Failure Signature
    enforcement: hard
