# 发布策略
schema_version: aix.policy/v1
name: release-policy
version: 0.1.0

rules:
  - id: release-clean-locked
    description: 发布必须从 clean 且固定 SHA 的 Lock 环境进行
    enforcement: hard

  - id: release-no-local-override
    description: Release Gate 默认拒绝存在 local override
    enforcement: hard

  - id: release-semver-consistent
    description: SemVer 必须与变更类型一致（major/minor/patch）
    enforcement: hard

  - id: release-human-approval
    description: commit/tag/publish/catalog-update 前必须有人工确认
    enforcement: hard

  - id: release-idempotent
    description: 发布动作必须幂等，可检测“已发布”而不是重复创建
    enforcement: hard

  - id: release-sbom
    description: 第三方依赖生成 SBOM 与许可证清单
    enforcement: hard

  - id: release-signature
    description: 发布 Tag 建议签名并记录校验信息
    enforcement: recommended

  - id: release-concurrency
    description: 并发 Release 使用互斥组，防止同一资产重复发布
    enforcement: hard

  - id: release-artifact-retention
    description: Artifact 设置大小、类型和保留策略
    enforcement: hard

protected_environment: true
catalog_update_required: true
