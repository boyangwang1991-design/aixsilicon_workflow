repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^\.github/workflows/   # GitHub workflow `on:` 触发 YAML1.1 布尔解析
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: mixed-line-ending

  # Guard: refuse staged paths from runtime/generated directories.
  # Skill 集中管理：canonical hooks 位于私有 skill repo，先经 bootstrap.py 物化 skills 到
  # ./.roo/skills/ 再执行。跨平台入口（F-013）：`uv run python`。
  - repo: local
    hooks:
      - id: aix-guard-runtime-paths
        name: aix-guard-runtime-paths
        entry: uv run python bootstrap.py --ensure && uv run python .roo/skills/aixsilicon-workspace-management/scripts/hooks/guard_runtime_paths.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: aix-check-vlnv-namespace
        name: aix-check-vlnv-namespace
        entry: uv run python bootstrap.py --ensure && uv run python .roo/skills/aixsilicon-workspace-management/scripts/hooks/check_vlnv_namespace.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # 统一格式化/风格由 ruff 承担（移除冗余的 black，见 P0-工程化）。
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
